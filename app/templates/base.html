<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Pytest Report Viewer{% endblock %}</title>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
    <header class="site-header">
        <div class="header-inner">
            <a href="/" class="logo">
                <span class="logo-icon">◉</span>
                <span class="logo-text">Pytest Report Viewer</span>
            </a>
            <nav class="nav">
                <a href="/">Dashboard</a>
                <a href="/bugs">Bugs</a>
                <a href="/labels-mismatch">Labels mismatch</a>
                <a href="/upload">Upload</a>
            </nav>
        </div>
    </header>
    <main class="main">
        {% block content %}{% endblock %}
    </main>
    <footer class="site-footer">
        <div class="footer-inner">
            <span>Pytest Execution Report Viewer</span>
            <span class="muted">Self-hosted QA dashboard</span>
        </div>
    </footer>
    {% block scripts %}{% endblock %}
</body>
</html>
